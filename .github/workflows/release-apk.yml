# 构建可安装的 Android 包，并发布到 GitHub Release。
# 手机上的「检查更新」读取这个 Release 里的 MobWriter.apk 和 update.json。
#
# 合并到 master 时只跑测试，不发布。
# 手动运行时勾选「构建并发布正式包」才会在测试通过后打 release。
# 勾选之后，如果已有正式标签还没有 GitHub Release，就发布其中最早的一个：
# 安装包从该标签已经指向的提交构建，不移动标签，也不分配更新的版本号。
# 每个正式标签都已有 Release 时，才按 v主.次.修订 把修订号加一并推送新标签，然后只发布一次。
# 因此 v0.1.2 已经指向某个提交但还没有 Release 时，下一次发布仍是 v0.1.2，而不是 v0.1.3。
# 手动运行时可以填写一个已经存在的正式标签，只发布那个标签；标签不存在则不会新建。
# 新的发布标成最新版本。不使用 build 标签，也不使用 1.0.运行编号 这种版本名。
# versionCode 使用本次运行编号，并且必须大于已经发布的 versionCode。
#
# gh release view 在 Release 不存在时可能写成 HTTP 404、not found，
# 或 could not find release（这句本身不含 not found）。这些都表示还没有 Release。
# 工作流会把 gh 的 stderr 打进日志，然后继续创建正式的 Latest 发布。其它错误会中止。
# 每条 gh 命令都带上仓库名。解析步骤若在空目录里调用 gh，会得到
# “not a git repository”，这不是 Release 缺失，不能当成可以发布。
#
# 用本仓库的 GITHUB_TOKEN 推送标签不会再触发工作流，所以自动标签本身不会打出第二个包。
# 测试通过后，同一次运行里的发布任务构建并上传这一个包。
# 若这个标签推送仍然冒出一次运行，发布任务会跳过 github-actions[bot]，
# 并且同一个版本标签不会并行构建。人工推送的正式标签仍发布该标签，不会再分配下一个号。
# 已有标签不会被覆盖或移动，包括 v0.1.0、v0.1.1 和 v0.1.2。
#
# 发布包必须用同一把钥匙签名，新版本才能覆盖安装旧版本。
# 不要把密钥库或口令写进仓库，放到 Actions Secrets，四个都要有：
# - ANDROID_KEYSTORE_BASE64：密钥库文件（.jks 或 .keystore）的 base64
# - ANDROID_KEYSTORE_PASSWORD
# - ANDROID_KEY_ALIAS
# - ANDROID_KEY_PASSWORD
# 缺任何一个时工作流失败，不会临时生成调试钥匙。
name: Release Android package

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release:
        description: "测试通过后构建并发布正式包。不勾选则只跑测试。"
        required: false
        default: false
        type: boolean
      tag:
        description: "已有正式标签。填写后只发布这个标签，不新建也不移动。留空则优先补齐还没有 Release 的最早正式标签。"
        required: false
        type: string

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-tag:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
      existing: ${{ steps.tag.outputs.existing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check version selection
        run: |
          python3 scripts/next-official-tag.py --self-test
          python3 scripts/official_release.py --self-test

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Run repository tests
        run: ./gradlew :core:test :app:test :app:lintDebug --build-cache

      - name: Select the official tag
        id: tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        env:
          TARGET_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: python3 scripts/select_official_tag.py

  publish:
    needs: test-and-tag
    # Manual runs publish only when the release box is checked and tests passed.
    # A tag push created with GITHUB_TOKEN does not publish again. Human tag pushes still do.
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_dispatch'
          && github.event.inputs.release == 'true'
          && needs.test-and-tag.result == 'success')
        || (github.event_name == 'push'
            && startsWith(github.ref, 'refs/tags/v')
            && github.actor != 'github-actions[bot]'
            && github.event.pusher.name != 'github-actions[bot]')
      )
    concurrency:
      group: publish-${{ needs.test-and-tag.outputs.tag || github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          PLANNED_TAG: ${{ needs.test-and-tag.outputs.tag }}
          PLANNED_COMMIT: ${{ needs.test-and-tag.outputs.commit }}
          PLANNED_EXISTING: ${{ needs.test-and-tag.outputs.existing }}
        run: python3 scripts/resolve_release.py

      - name: Checkout the tagged commit
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.commit != github.sha
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.commit }}
          persist-credentials: false

      - name: Setup Java
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        if: steps.gate.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        if: steps.gate.outputs.skip != 'true'
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        if: steps.gate.outputs.skip != 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Require stable signing
        if: steps.gate.outputs.skip != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "Set all four release signing secrets before publishing. This workflow does not create a debug keystore."
            echo "Required: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
          if [ ! -s "${RUNNER_TEMP}/release.keystore" ]; then
            echo "ANDROID_KEYSTORE_BASE64 did not decode to a keystore file."
            exit 1
          fi

      - name: Build signed release APK
        if: steps.gate.outputs.skip != 'true'
        env:
          MOBWRITER_STORE_FILE: ${{ runner.temp }}/release.keystore
          MOBWRITER_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MOBWRITER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MOBWRITER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.gate.outputs.code }}
          VERSION_NAME: ${{ steps.gate.outputs.name }}
          EXPECTED_COMMIT: ${{ steps.gate.outputs.commit }}
        run: |
          if [ "$(git rev-parse HEAD)" != "${EXPECTED_COMMIT}" ]; then
            echo "refusing to build a commit the official tag does not point at"
            exit 1
          fi
          ./gradlew :app:assembleRelease --build-cache \
            -Pmobwriter.updateOwner="${GITHUB_REPOSITORY_OWNER}" \
            -Pmobwriter.updateRepo="${GITHUB_REPOSITORY#*/}" \
            -Pmobwriter.versionCode="${VERSION_CODE}" \
            -Pmobwriter.versionName="${VERSION_NAME}"
          cp app/build/outputs/apk/release/app-release.apk MobWriter.apk

      - name: Write update manifest
        if: steps.gate.outputs.skip != 'true' && (steps.gate.outputs.create == 'true' || steps.gate.outputs.upload_json == 'true')
        env:
          VERSION_CODE: ${{ steps.gate.outputs.code }}
          VERSION_NAME: ${{ steps.gate.outputs.name }}
        run: |
          python3 - <<'PY'
          import json, os
          manifest = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "apkName": "MobWriter.apk",
          }
          with open("update.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY

      - name: Publish GitHub Release
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.gate.outputs.tag }}
          VERSION_NAME: ${{ steps.gate.outputs.name }}
          VERSION_CODE: ${{ steps.gate.outputs.code }}
          CREATE: ${{ steps.gate.outputs.create }}
          UPLOAD_APK: ${{ steps.gate.outputs.upload_apk }}
          UPLOAD_JSON: ${{ steps.gate.outputs.upload_json }}
          COMMIT: ${{ steps.gate.outputs.commit }}
          EXISTING: ${{ steps.gate.outputs.existing }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          tag = os.environ["TAG"]
          name = os.environ["VERSION_NAME"]
          code = os.environ["VERSION_CODE"]
          expected = os.environ["COMMIT"]
          existing = os.environ["EXISTING"] == "true"
          repo = os.environ["GITHUB_REPOSITORY"]
          if re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", tag) is None or name != tag[1:]:
              sys.exit("refusing an unofficial version")
          if tag.lower() == "latest" or tag.lower().startswith("build-") or any(piece in tag.lower() for piece in ("-pre", "-rc", "-alpha", "-beta")):
              sys.exit("refusing this tag")
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if head != expected:
              sys.exit("refusing to build a commit the official tag does not point at")
          title = f"墨哺 {name}"
          notes = (
              f"墨哺 {name}（{code}）\n"
              "\n"
              "安装包是 `MobWriter.apk`，使用仓库 Secrets 里的同一把签名钥匙。"
              "`versionCode` 更高的包可以覆盖安装上一包。"
              "以前用调试签名装上的版本签的是另一把钥匙，需要先卸载一次，再装这把钥匙签的第一包。"
              "卸载会清掉手机上的令牌和草稿。\n"
              "\n"
              "在手机上打开「我的 → 设置 → 检查更新」。"
              "`update.json` 里的 versionCode 比已安装版本更高时，应用下载 APK 并打开系统安装；"
              "如果不能直接安装，就打开本页面。\n"
          )
          forbidden = ("预发布", "pre-release", "prerelease", "pre release")
          lowered = f"{title}\n{notes}".lower()
          if any(word.lower() in lowered for word in forbidden):
              sys.exit("release text was rejected")
          notes_path = os.path.join(os.environ["RUNNER_TEMP"], "release-notes.md")
          with open(notes_path, "w", encoding="utf-8") as handle:
              handle.write(notes)

          def remote_commit(tag_name: str) -> str:
              raw = subprocess.check_output(
                  [
                      "git",
                      "ls-remote",
                      "--tags",
                      "origin",
                      f"refs/tags/{tag_name}",
                      f"refs/tags/{tag_name}^{{}}",
                  ],
                  text=True,
              )
              commit = ""
              for line in raw.splitlines():
                  if not line.strip():
                      continue
                  found, ref = line.split()
                  if ref.endswith("^{}"):
                      return found
                  commit = found
              return commit

          if os.environ["CREATE"] == "true":
              command = [
                  "gh", "release", "create", tag,
                  "MobWriter.apk", "update.json",
                  "--repo", repo,
                  "--title", title,
                  "--notes-file", notes_path,
                  "--latest",
              ]
              remote = remote_commit(tag)
              if existing:
                  if remote != expected:
                      sys.exit("refusing to move or recreate an existing tag")
              elif remote and remote != expected:
                  sys.exit("refusing to move an existing tag")
              elif not remote:
                  if expected != os.environ["GITHUB_SHA"]:
                      sys.exit("refusing to create a tag from a different commit")
                  command.extend(["--target", expected])
              subprocess.check_call(command)
          else:
              if os.environ["UPLOAD_APK"] == "true":
                  subprocess.check_call(["gh", "release", "upload", tag, "MobWriter.apk", "--repo", repo])
              if os.environ["UPLOAD_JSON"] == "true":
                  subprocess.check_call(["gh", "release", "upload", tag, "update.json", "--repo", repo])
          print(f"Published {tag} once.")
          PY
